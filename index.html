<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Réseau Potes</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fff; color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { width: 450px; background: #f4f4f4; border: 1px solid #ccc; padding: 20px; box-sizing: border-box; }
        h2 { text-align: center; margin-top: 0; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; border: 1px solid #000; background: #fff; color: #000; font-size: 14px; }
        button { background: #000; color: #fff; cursor: pointer; font-weight: bold; }
        button:hover { background: #333; }
        #chat-section { display: none; }
        .chat-layout { display: flex; gap: 10px; }
        .sidebar { width: 40%; border: 1px solid #ccc; background: #fff; padding: 5px; height: 250px; overflow-y: auto; font-size: 13px; }
        .chat-main { width: 60%; display: flex; flex-direction: column; }
        #messages { height: 200px; border: 1px solid #ccc; background: #fff; overflow-y: scroll; padding: 6px; margin-bottom: 5px; font-size: 13px; }
        .item { padding: 4px; border-bottom: 1px solid #eee; cursor: pointer; }
        .item:hover { background: #f4f4f4; }
    </style>
</head>
<body>

<div class="container">
    <!-- CONNEXION -->
    <div id="login-section">
        <h2>Connexion / Inscription</h2>
        <input type="text" id="username-input" placeholder="Ton pseudo...">
        <input type="password" id="password-input" placeholder="Ton mot de passe...">
        <button id="login-btn">Entrer</button>
        <p id="error-msg" style="color:red; font-size:12px; text-align:center;"></p>
    </div>

    <!-- CHAT -->
    <div id="chat-section">
        <h2 id="room-title" style="font-size: 16px;">Discussion</h2>
        <div class="chat-layout">
            <div class="sidebar">
                <input type="text" id="add-friend-input" placeholder="Pseudo ami..." style="margin-top:0; font-size:12px; padding:5px;">
                <button id="add-friend-btn" style="margin-top:5px; padding:5px; font-size:12px;">Ajouter</button>
                <div id="friends-list" style="margin-top:10px;"></div>
            </div>
            <div class="chat-main">
                <div id="messages"></div>
                <div style="display: flex;">
                    <input type="text" id="message-input" placeholder="Message..." style="margin-top:0; padding:5px; font-size:12px;">
                    <button id="send-btn" style="margin-top:0; width:auto; padding:0 8px; font-size:12px;">></button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Socket.io script -->
<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();

    const loginSection = document.getElementById('login-section');
    const chatSection = document.getElementById('chat-section');
    const usernameInput = document.getElementById('username-input');
    const passwordInput = document.getElementById('password-input');
    const loginBtn = document.getElementById('login-btn');
    const errorMsg = document.getElementById('error-msg');

    const friendsList = document.getElementById('friends-list');
    const messagesDiv = document.getElementById('messages');
    const roomTitle = document.getElementById('room-title');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const addFriendBtn = document.getElementById('add-friend-btn');
    const addFriendInput = document.getElementById('add-friend-input');

    let myUsername = "";
    let currentContact = "Général";

    loginBtn.onclick = () => {
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();
        if(username && password) {
            socket.emit('login', { username, password });
        }
    };

    socket.on('login_success', (username) => {
        myUsername = username;
        loginSection.style.display = 'none';
        chatSection.style.display = 'block';
        ouvrirDiscussion("Général");
    });

    socket.on('error_msg', (msg) => {
        errorMsg.textContent = msg;
    });

    addFriendBtn.onclick = () => {
        const target = addFriendInput.value.trim();
        if(target) {
            socket.emit('send_friend_request', target);
            addFriendInput.value = "";
        }
    };

    // Gestion de la liste d'amis et des demandes reçues
    socket.on('friend_data', (rows) => {
        friendsList.innerHTML = `<div class="item" onclick="ouvrirDiscussion('Général')"># Général</div>`;
        
        rows.forEach(row => {
            if (row.status === 'accepted') {
                let ami = row.sender === myUsername ? row.receiver : row.sender;
                friendsList.innerHTML += `<div class="item" onclick="ouvrirDiscussion('${ami}')">${ami}</div>`;
            } else if (row.receiver === myUsername) {
                // Demande en attente reçue
                friendsList.innerHTML += `<div style="font-size:11px; margin-top:5px; border-bottom:1px solid #ddd; padding-bottom:3px;">
                    <b>${row.sender}</b> veut être ami<br>
                    <button onclick="repondreAmi('${row.sender}', true)" style="padding:2px; font-size:10px; width:45%;">Oui</button>
                    <button onclick="repondreAmi('${row.sender}', false)" style="padding:2px; font-size:10px; width:45%; background:#ccc; color:#000;">Non</button>
                </div>`;
            }
        });
    });

    function repondreAmi(sender, accept) {
        socket.emit('respond_friend', { sender, accept });
    }

    function ouvrirDiscussion(contact) {
        currentContact = contact;
        roomTitle.textContent = contact;
        socket.emit('load_chat', contact);
    }

    socket.on('chat_history', ({ contact, messages }) => {
        if (contact === currentContact) {
            messagesDiv.innerHTML = "";
            messages.forEach(m => afficherMessage(m.sender, m.content));
        }
    });

    sendBtn.onclick = () => {
        const content = messageInput.value.trim();
        if(content) {
            socket.emit('send_message', { receiver: currentContact, content });
            messageInput.value = "";
        }
    };

    messageInput.onkeypress = (e) => { if (e.key === 'Enter') sendBtn.click(); };

    socket.on('new_message', (msg) => {
        if (msg.receiver === currentContact || msg.sender === currentContact || (msg.receiver === 'Général' && currentContact === 'Général')) {
            if (msg.receiver !== 'Général' && msg.sender !== myUsername && msg.sender !== currentContact) return;
            afficherMessage(msg.sender, msg.content);
        }
    });

    function afficherMessage(sender, content) {
        messagesDiv.innerHTML += `<div><b>${sender}</b>: ${content}</div>`;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
</script>

</body>
</html>
